[package]
name = "shorty"
version = "0.1.0"
edition = "2024"

[features]
test-util = []

[dependencies]
axum = "0.8"
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", default-features = false }
mockall = { version = "0.15", optional = true }

[dev-dependencies]
shorty = { path = ".", features = ["test-util"] }
tokio = { version = "1.53", features = ["full", "test-util"] }
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rstest = "0.27"
insta = "1.49"
expect-test = "1.5"
tempfile = "3.27"
mockall = "0.15"
proptest = "1.11"
assert_cmd = "2.2"
predicates = "3.1"
wiremock = "0.6"
trybuild = "1.0"
datatest-stable = "0.3"

[[test]]
name = "cases"
harness = false
